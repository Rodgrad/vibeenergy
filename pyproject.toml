[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energytlk"
version = "1.0.0"
description = "Unprivileged local CPU/GPU energy monitoring for Plasma 6"
requires-python = ">=3.10"

[project.scripts]
energytlk-collector = "energytlk.collector:main"

[tool.setuptools]
packages = ["energytlk"]
